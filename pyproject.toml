[project]
name = "backup-drill"
version = "1.0.0"
description = "Резервные копии с учебной тревогой: копирование, проверка восстановлением, ротация"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
drill = "drill.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
    "mypy>=1.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "PT", "RUF", "DTZ"]
# RUF001-003: в русских строках есть кириллица, похожая на латиницу, — это нормально.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["drill"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
