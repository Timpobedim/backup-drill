# Пример настроек: два задания с разными сроками хранения.
# Пути считаются от папки, в которой лежит этот файл.

[storage]
folder = "копии"
journal = "копии/журнал.sqlite"
# Если успешной тревоги не было дольше этого срока, «drill status» поднимет тревогу уже настоящую.
drill_every_days = 7

[[job]]
name = "документы"
sources = ["данные/документы"]
excludes = ["*.tmp", "~$*", "Thumbs.db"]
keep_daily = 7
keep_weekly = 4
keep_monthly = 6

[[job]]
name = "база"
sources = ["данные/дампы"]
compress = true
# База выгружается каждую ночь, недельные и месячные копии не нужны: их делает сервер базы.
keep_daily = 14
keep_weekly = 0
keep_monthly = 0
